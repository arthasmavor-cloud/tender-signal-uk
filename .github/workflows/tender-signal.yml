name: TenderSignal monitor

on:
  schedule:
    # Daily founder-plan digest. GitHub Actions schedules are UTC.
    - cron: "15 8 * * *"
    # Fallback if the primary scheduled run is delayed or skipped. The worker's
    # daily digest table prevents a second digest on the same UTC day.
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Send a delivery test to the configured sender address"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load private subscriber profiles
        env:
          TENDERSIGNAL_SUBSCRIBERS_JSON: ${{ secrets.TENDERSIGNAL_SUBSCRIBERS_JSON }}
          TENDERSIGNAL_SUBSCRIBERS_ENDPOINT: ${{ secrets.TENDERSIGNAL_SUBSCRIBERS_ENDPOINT }}
        run: |
          if [ -n "$TENDERSIGNAL_SUBSCRIBERS_ENDPOINT" ]; then
            echo "Using protected active-subscriber endpoint."
          else
            test -n "$TENDERSIGNAL_SUBSCRIBERS_JSON" || { echo "Missing TENDERSIGNAL_SUBSCRIBERS_JSON secret"; exit 1; }
            mkdir -p config
            printf '%s' "$TENDERSIGNAL_SUBSCRIBERS_JSON" > config/subscribers.json
          fi
      - name: Run monitor
        env:
          TENDERSIGNAL_SMTP_HOST: ${{ secrets.TENDERSIGNAL_SMTP_HOST }}
          TENDERSIGNAL_SMTP_PORT: ${{ secrets.TENDERSIGNAL_SMTP_PORT }}
          TENDERSIGNAL_SMTP_USER: ${{ secrets.TENDERSIGNAL_SMTP_USER }}
          TENDERSIGNAL_SMTP_PASSWORD: ${{ secrets.TENDERSIGNAL_SMTP_PASSWORD }}
          TENDERSIGNAL_SMTP_FROM: ${{ secrets.TENDERSIGNAL_SMTP_FROM }}
          TENDERSIGNAL_UNSUBSCRIBE_ADDRESS: ${{ secrets.TENDERSIGNAL_UNSUBSCRIBE_ADDRESS }}
          TENDERSIGNAL_SUBSCRIBERS_ENDPOINT: ${{ secrets.TENDERSIGNAL_SUBSCRIBERS_ENDPOINT }}
          TENDERSIGNAL_SUBSCRIBERS_TOKEN: ${{ secrets.TENDERSIGNAL_SUBSCRIBERS_TOKEN }}
          TENDERSIGNAL_SMOKE_TEST: ${{ inputs.smoke_test && 'true' || 'false' }}
        run: python worker/tender_signal.py
      - name: Preserve delivery de-duplication state
        run: |
          git config user.name "tendersignal-bot"
          git config user.email "tendersignal-bot@users.noreply.github.com"
          # The database is intentionally gitignored locally because it can hold
          # customer delivery history; the workflow force-adds only this state
          # file so scheduled runs do not re-send the same alert.
          git add -f data/tender_signal.sqlite3
          git diff --cached --quiet || git commit -m "chore: update tender delivery state"
          git push
